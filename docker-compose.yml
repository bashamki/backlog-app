services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backlog
      POSTGRES_PASSWORD: backlog
      POSTGRES_DB: backlog
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backlog"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql://backlog:backlog@db:5432/backlog?schema=public"
      JWT_SECRET: "change-me-in-prod"
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dbdata:
